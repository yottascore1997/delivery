<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="514" viewBox="0 0 1200 514" role="img" aria-label="Today's match banner placeholder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0c4a6e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="514" fill="url(#bg)"/>
  <text x="600" y="240" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="42" font-weight="800">Today&apos;s match</text>
  <text x="600" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22" font-weight="600">Replace with your banner: public/banners/todays-match.jpg</text>
</svg>
